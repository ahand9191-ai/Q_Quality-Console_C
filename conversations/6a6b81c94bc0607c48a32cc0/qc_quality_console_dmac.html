<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q.C. Quality Console — MTR Verification</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:#f5f5f0;color:#1a1a1a;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Header */
#header{background:#1a3a5c;color:#fff;padding:6px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#header h1{font-size:17px;letter-spacing:3px;font-weight:normal;text-transform:uppercase}
#header .subtitle{font-size:10px;color:#b0c4d8;letter-spacing:1px}
#header .doc-type{font-size:11px;color:#c5a05e;border:1px solid #c5a05e;padding:2px 10px;border-radius:2px}

/* Main layout */
#main{display:flex;flex:1;overflow:hidden}
#pdf-area{flex:1;overflow:auto;background:#e0e0db;padding:15px;position:relative}
#sidebar{width:430px;min-width:430px;overflow-y:auto;background:#fff;border-left:2px solid #1a3a5c}

/* PDF viewer */
#pdf-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
#pdf-canvas{border:1px solid #aaa;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:100%}
#page-nav{display:flex;align-items:center;gap:12px;background:#fff;padding:6px 16px;border:1px solid #ccc;border-radius:3px;font-size:13px}
#page-nav button{background:#1a3a5c;color:#fff;border:none;padding:4px 12px;cursor:pointer;font-family:Georgia,serif;font-size:12px;border-radius:2px}
#page-nav button:disabled{opacity:.4;cursor:default}
#drop-zone{border:2px dashed #999;border-radius:4px;padding:40px;text-align:center;color:#666;font-size:14px;cursor:pointer}
#drop-zone.drag{border-color:#1a3a5c;background:#e8eef5}

/* Document selector */
#doc-selector{background:#1a3a5c;color:#fff;padding:8px 15px;display:flex;align-items:center;gap:10px;font-size:12px}
#doc-selector select{background:#fff;color:#1a3a5c;border:none;padding:3px 8px;font-family:Georgia,serif;font-size:12px;border-radius:2px;flex:1}
#doc-selector .label{color:#c5a05e;letter-spacing:1px;font-size:10px;text-transform:uppercase}

/* Form fields */
.section{padding:14px 15px;border-bottom:1px solid #e0e0d8}
.section h3{font-size:13px;color:#1a3a5c;margin-bottom:8px;letter-spacing:1px}
.field{margin-bottom:8px}
.field label{display:block;font-size:10px;color:#555;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px;font-family:Arial,sans-serif}
.field input,.field select{width:100%;padding:5px 7px;border:1px solid #ccc;font-family:Georgia,serif;font-size:13px;background:#fafafa;border-radius:2px}
.field input:focus,.field select:focus{border-color:#1a3a5c;background:#fff;outline:none}
.field input.prefilled{background:#e8f4e8;border-color:#8c8}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}
.step-tag{background:#1a3a5c;color:#fff;font-size:9px;padding:2px 8px;border-radius:2px;letter-spacing:1px;font-family:Arial,sans-serif}
.step-section{transition:opacity .3s}
.step-section.locked{opacity:.45;pointer-events:none}

/* Chemistry table */
.chem-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.chem-tbl th{background:#1a3a5c;color:#fff;padding:4px 6px;text-align:left;font-size:10px;font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.chem-tbl td{padding:4px 6px;border-bottom:1px solid #eee}
.chem-pass{color:#1a7a30;font-weight:bold}
.chem-fail{color:#c00;font-weight:bold}
.chem-info{color:#666;font-size:10px}
.heat-tabs{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.heat-tab{padding:4px 12px;background:#eee;border:1px solid #ccc;cursor:pointer;font-size:12px;border-radius:2px;font-family:Georgia,serif}
.heat-tab.active{background:#1a3a5c;color:#fff;border-color:#1a3a5c}

/* Approval */
#approval-area{padding:14px 15px}
.approval-banner{padding:10px;text-align:center;font-weight:bold;font-size:14px;letter-spacing:2px;margin-bottom:10px;border-radius:2px}
.approval-banner.approved{background:#d4edda;color:#155724;border:2px solid #155724}
.approval-banner.rejected{background:#f8d7da;color:#721c24;border:2px solid #721c24}
.approval-banner.revise{background:#fff3cd;color:#856404;border:2px solid #856404}
.approval-btns{display:flex;gap:8px;margin-top:10px}
.approval-btns button{flex:1;padding:10px;border:none;cursor:pointer;font-family:Georgia,serif;font-size:13px;font-weight:bold;letter-spacing:1px;border-radius:2px}
.btn-approve{background:#1a7a30;color:#fff}
.btn-reject{background:#c00;color:#fff}
.btn-revise{background:#c5a05e;color:#fff}
.btn-primary{background:#1a3a5c;color:#fff;padding:8px 16px;border:none;cursor:pointer;font-family:Georgia,serif;font-size:13px;border-radius:2px;width:100%;margin-top:8px;letter-spacing:1px}
.btn-primary:hover{background:#2a4a6c}
.btn-secondary{background:#555;color:#fff;padding:6px 12px;border:none;cursor:pointer;font-family:Georgia,serif;font-size:12px;border-radius:2px}
.note{font-size:11px;color:#888;margin-top:4px;font-style:italic}

/* Stamp overlay */
#stamp-canvas{position:absolute;pointer-events:none}

/* Loading */
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#666;font-size:14px}
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>Q.C. Quality Console</h1>
    <div class="subtitle">Material Test Report Verification &amp; Approval System</div>
  </div>
  <div class="doc-type">MTR VERIFICATION</div>
</div>

<div id="main">
  <div id="pdf-area">
    <div id="loading">Loading document…</div>
    <div id="pdf-wrap" style="display:none">
      <div id="page-nav">
        <button id="prev-page" onclick="prevPage()">◀ PREV</button>
        <span>Page <span id="cur-page">1</span> of <span id="total-pages">1</span></span>
        <button id="next-page" onclick="nextPage()">NEXT ▶</button>
      </div>
      <div style="position:relative">
        <canvas id="pdf-canvas"></canvas>
        <canvas id="stamp-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <div id="doc-selector" style="display:none">
      <span class="label">Document</span>
      <select id="doc-select" onchange="switchDocument()"></select>
    </div>

    <!-- STEP 1: MTR Information -->
    <div class="section step-section" id="sec-step1">
      <span class="step-tag">STEP 1</span>
      <h3>MTR Information — Review &amp; Verify</h3>
      <div class="field"><label>PO Number</label><input id="po-number" placeholder="e.g. 1867667"></div>
      <div class="field"><label>Mill / Supplier</label><input id="mill-name" placeholder="e.g. Nucor-Yamato Steel"></div>
      <div class="field-row">
        <div class="field"><label>Material Type</label>
          <select id="mat-type" onchange="onMaterialChange()">
            <option value="">— Select —</option>
            <option value="beam">Beam (W-Shape)</option><option value="channel">Channel</option><option value="angle">Angle</option>
            <option value="flatbar">Flat Bar</option><option value="plate">Plate</option><option value="decking">Decking</option>
            <option value="hss-round">HSS Round</option><option value="hss-square">HSS Square / Rect.</option>
            <option value="pipe">Pipe</option><option value="round-bar">Round Bar</option><option value="sheet">Sheet</option>
            <option value="square-bar">Square Bar</option><option value="studs">Studs</option>
            <option value="bearings">Bearings</option><option value="hardware">Hardware (Bolts/Fasteners)</option>
          </select>
        </div>
        <div class="field"><label>Specification</label><select id="spec-select" onchange="initChem()"></select></div>
      </div>
      <div class="field"><label id="type-label">Size</label><input id="beam-type" placeholder="e.g. W24x76"></div>
      <div class="field"><label>Quantity</label><input id="quantity" placeholder="e.g. 40 ft 0 in"></div>
      <div class="field"><label>Heat #1</label><input id="heat1" placeholder="e.g. 627779"></div>
      <div class="field"><label>Heat #2</label><input id="heat2" placeholder="if applicable"></div>
      <div class="field"><label>Heat #3</label><input id="heat3" placeholder="if applicable"></div>
      <div class="field"><label>Heat #4</label><input id="heat4" placeholder="if applicable"></div>
      <div class="field"><label>Heat #5</label><input id="heat5" placeholder="if applicable"></div>
      <div class="field"><label>Coil Number(s)</label><input id="coil-number" placeholder="e.g. 2031307-1, 2031307-2"></div>
      <div class="field"><label>Country of Origin</label><input id="country-origin" placeholder="e.g. USA" style="font-weight:bold;color:#1a5c1a"></div>
      <div class="field-row">
        <div class="field"><label>CVN Zone</label>
          <select id="cvn-zone"><option value="" selected>— N/A —</option><option value="1">Zone 1 (70°F)</option><option value="2">Zone 2 (40°F)</option><option value="3">Zone 3 (10°F)</option></select>
        </div>
        <div class="field"><label>FCM</label>
          <select id="fcm-select"><option value="N">No</option><option value="Y">Yes</option></select>
        </div>
      </div>
      <div class="field"><label>Welding Code</label>
        <select id="weld-code"><option value="D1.5">AWS D1.5 (Bridge)</option><option value="D1.1">AWS D1.1 (Structural)</option><option value="both">Both D1.1 &amp; D1.5</option><option value="none">N/A</option></select>
      </div>
      <button class="btn-primary" onclick="setStep(2)">REVIEW COMPLETE — PROCEED TO CHEMICAL CHECK</button>
    </div>

    <!-- STEP 2: Chemical Composition -->
    <div class="section step-section locked" id="sec-step2">
      <span class="step-tag">STEP 2</span>
      <h3>Chemical Composition Verification</h3>
      <div class="heat-tabs" id="heat-tabs"></div>
      <table class="chem-tbl"><thead><tr><th>Element</th><th>Value %</th><th>Spec Limit</th><th>Status</th></tr></thead><tbody id="chem-body"></tbody></table>
      <div id="chem-summary" style="margin-top:8px;font-size:12px"></div>
      <button class="btn-primary" onclick="setStep(3)">CHEMISTRY VERIFIED — PROCEED TO APPROVAL</button>
    </div>

    <!-- STEP 3: Approval -->
    <div class="section step-section locked" id="sec-step3" style="background:#faf8f0;border-bottom:2px solid #c5a05e">
      <span class="step-tag">STEP 3</span>
      <h3>Approval &amp; Certification</h3>
      <div id="approval-status-area"></div>
      <div class="field"><label>Reviewer Name</label><input id="reviewer-name" placeholder="Qualified Personnel"></div>
      <div class="field"><label>Review Date</label><input id="review-date" type="date"></div>
      <div class="field"><label>Inspection Comments</label><input id="review-comments" placeholder="Comments…"></div>
      <div class="approval-btns">
        <button class="btn-approve" onclick="submitApproval('Approved')">APPROVE</button>
        <button class="btn-reject" onclick="submitApproval('Rejected')">REJECT</button>
        <button class="btn-revise" onclick="submitApproval('Revise')">REVISE</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn-secondary" id="btn-download" onclick="downloadStamped()" disabled style="flex:1">DOWNLOAD STAMPED PDF</button>
        <button class="btn-secondary" onclick="generateCertificate()" id="btn-cert" disabled style="flex:1">PRINT CERTIFICATE</button>
      </div>
    </div>

    <div class="section">
      <h3>Session Records</h3>
      <div id="records-list" style="font-size:12px;max-height:200px;overflow-y:auto"></div>
      <button class="btn-secondary" onclick="clearRecords()" style="margin-top:6px">Clear Local Records</button>
    </div>
  </div>
</div>

// === STATE ===
var pdfDoc=null,curPage=1,scale=1.5,approvalState=null,currentStep=1,activeHeatIdx=0;

if(pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// === PDF LOADING ===
async function loadPDF(url){
  if(!url){document.getElementById('loading').textContent='No document URL provided.';return;}
  try{
    var loadingTask=pdfjsLib.getDocument(url);
    pdfDoc=await loadingTask.promise;
    document.getElementById('total-pages').textContent=pdfDoc.numPages;
    document.getElementById('loading').style.display='none';
    document.getElementById('pdf-wrap').style.display='flex';
    renderPage(1);
  }catch(e){
    document.getElementById('loading').textContent='Failed to load PDF: '+e.message;
  }
}

async function renderPage(num){
  if(!pdfDoc)return;
  curPage=num;
  var page=await pdfDoc.getPage(num);
  var viewport=page.getViewport({scale:scale});
  var canvas=document.getElementById('pdf-canvas');
  var ctx=canvas.getContext('2d');
  canvas.width=viewport.width;
  canvas.height=viewport.height;
  // Resize stamp canvas to match
  var stampCanvas=document.getElementById('stamp-canvas');
  stampCanvas.width=viewport.width;
  stampCanvas.height=viewport.height;
  stampCanvas.style.width=viewport.width+'px';
  stampCanvas.style.height=viewport.height+'px';
  await page.render({canvasContext:ctx,viewport:viewport}).promise;
  document.getElementById('cur-page').textContent=num;
  document.getElementById('prev-page').disabled=(num<=1);
  document.getElementById('next-page').disabled=(num>=pdfDoc.numPages);
  // Re-draw stamp if approved
  if(approvalState) drawStamp();
}

function prevPage(){if(curPage>1)renderPage(curPage-1)}
function nextPage(){if(pdfDoc&&curPage<pdfDoc.numPages)renderPage(curPage+1)}

// === DATA FILLING ===
function fillFields(doc){
  if(!doc)return;
  var setVal=function(id,val){
    var el=document.getElementById(id);
    if(el&&val!==undefined&&val!==null&&val!==''){
      el.value=val;
      el.classList.add('prefilled');
    }else if(el){
      el.value='';
      el.classList.remove('prefilled');
    }
  };
  setVal('po-number',doc.poNumber);
  setVal('mill-name',doc.mill);
  setVal('beam-type',doc.size);
  setVal('quantity',doc.quantity);
  setVal('heat1',doc.heatNumbers&&doc.heatNumbers[0]);
  setVal('heat2',doc.heatNumbers&&doc.heatNumbers[1]);
  setVal('heat3',doc.heatNumbers&&doc.heatNumbers[2]);
  setVal('heat4',doc.heatNumbers&&doc.heatNumbers[3]);
  setVal('heat5',doc.heatNumbers&&doc.heatNumbers[4]);
  setVal('coil-number',doc.coilNumbers?doc.coilNumbers.join(', '):'');
  setVal('country-origin',doc.countryOfOrigin);

  // Material type
  if(doc.materialType){
    var matSelect=document.getElementById('mat-type');
    for(var i=0;i<matSelect.options.length;i++){
      if(matSelect.options[i].value===doc.materialType){matSelect.selectedIndex=i;break;}
    }
  }
  onMaterialChange();

  // Specification
  if(doc.spec){
    var specSelect=document.getElementById('spec-select');
    for(var i=0;i<specSelect.options.length;i++){
      if(specSelect.options[i].value===doc.spec){specSelect.selectedIndex=i;break;}
    }
  }

  // CVN / FCM / Welding code
  if(doc.cvnZone){document.getElementById('cvn-zone').value=doc.cvnZone;}
  if(doc.fcm){document.getElementById('fcm-select').value=doc.fcm;}
  if(doc.weldingCode){document.getElementById('weld-code').value=doc.weldingCode;}

  // Store chemistry data for this doc
  window._currentChemistry=doc.chemistry||{};
  initChem();
}

// === MATERIAL TYPE ===
function onMaterialChange(){
  var mat=document.getElementById('mat-type').value;
  var specSelect=document.getElementById('spec-select');
  var typeLabel=document.getElementById('type-label');
  specSelect.innerHTML='<option value="">— Select —</option>';
  if(mat&&MAT_SPECS[mat]){
    for(var i=0;i<MAT_SPECS[mat].length;i++){
      var s=MAT_SPECS[mat][i];
      var opt=document.createElement('option');
      opt.value=s;opt.textContent=SPECS[s]?SPECS[s].name:s;
      specSelect.appendChild(opt);
    }
  }
  if(mat&&MAT_LABELS[mat]){typeLabel.textContent=MAT_LABELS[mat];}
  else{typeLabel.textContent='Size';}
  // Add A500 always per user instruction
  if(mat&&!['A500-B','A500-C'].every(function(s){return MAT_SPECS[mat]&&MAT_SPECS[mat].indexOf(s)!==-1})){
    // already handled above
  }
}

// === CHEMISTRY VERIFICATION ===
function initChem(){
  var spec=document.getElementById('spec-select').value;
  var chem=window._currentChemistry||{};
  var heatInputs=['heat1','heat2','heat3','heat4','heat5'];
  var heats=[];
  for(var i=0;i<heatInputs.length;i++){
    var h=document.getElementById(heatInputs[i]).value.trim();
    if(h) heats.push(h);
  }

  // Build heat tabs
  var tabsEl=document.getElementById('heat-tabs');
  tabsEl.innerHTML='';
  for(var j=0;j<heats.length;j++){
    var tab=document.createElement('span');
    tab.className='heat-tab'+(j===activeHeatIdx?' active':'');
    tab.textContent=heats[j];
    tab.onclick=function(idx){return function(){activeHeatIdx=idx;initChem();}}(j);
    tabsEl.appendChild(tab);
  }

  var body=document.getElementById('chem-body');
  body.innerHTML='';

  if(!spec||heats.length===0){
    body.innerHTML='<tr><td colspan="4" style="color:#999;text-align:center;padding:10px">Select a specification and ensure heat numbers are entered.</td></tr>';
    document.getElementById('chem-summary').innerHTML='';
    return;
  }

  var specData=SPECS[spec];
  var specElems=specData?specData.elements:{};
  var heat=heats[activeHeatIdx]||heats[0];
  var heatChem=chem[heat]||{};

  var passCount=0,failCount=0,infoCount=0;

  // Show spec-limited elements first
  var specKeys=Object.keys(specElems);
  for(var k=0;k<specKeys.length;k++){
    var elem=specKeys[k];
    var limit=specElems[elem];
    var val=heatChem[elem];
    var tr=document.createElement('tr');

    // Element name
    var td1=document.createElement('td');
    td1.textContent=limit.label||elem;
    tr.appendChild(td1);

    // Value
    var td2=document.createElement('td');
    td2.textContent=val!==undefined?val:'—';
    tr.appendChild(td2);

    // Spec limit
    var td3=document.createElement('td');
    var limitStr='';
    if(limit.min!==null&&limit.max!==null) limitStr=limit.min+'–'+limit.max+'%';
    else if(limit.max!==null) limitStr='≤ '+limit.max+'%';
    else if(limit.min!==null) limitStr='≥ '+limit.min+'%';
    td3.textContent=limitStr;
    tr.appendChild(td3);

    // Status
    var td4=document.createElement('td');
    if(val!==undefined&&val!==''){
      var numVal=parseFloat(val);
      var pass=true;
      if(limit.max!==null&&numVal>limit.max) pass=false;
      if(limit.min!==null&&numVal<limit.min) pass=false;
      td4.className=pass?'chem-pass':'chem-fail';
      td4.textContent=pass?'✓ PASS':'✗ FAIL';
      if(pass)passCount++;else failCount++;
    }else{
      td4.className='chem-info';
      td4.textContent='Not reported';
      infoCount++;
    }
    tr.appendChild(td4);
    body.appendChild(tr);
  }

  // Show additional reported elements (not in spec limits)
  var allReported=Object.keys(heatChem);
  for(var m=0;m<allReported.length;m++){
    var e=allReported[m];
    if(specKeys.indexOf(e)!==-1) continue;
    var tr2=document.createElement('tr');
    var td1=document.createElement('td');td1.textContent=e;tr2.appendChild(td1);
    var td2=document.createElement('td');td2.textContent=heatChem[e];tr2.appendChild(td2);
    var td3=document.createElement('td');td3.textContent='—';td3.className='chem-info';tr2.appendChild(td3);
    var td4=document.createElement('td');td4.textContent='Reported';td4.className='chem-info';tr2.appendChild(td4);
    body.appendChild(tr2);
    infoCount++;
  }

  var summary=document.getElementById('chem-summary');
  var cls=failCount>0?'chem-fail':'chem-pass';
  summary.innerHTML='<span class="'+cls+'">'+passCount+' passed, '+failCount+' failed, '+infoCount+' reported (no spec limit)</span>';
}

// === STEP NAVIGATION ===
function setStep(step){
  currentStep=step;
  document.getElementById('sec-step1').classList.toggle('locked',step>1);
  document.getElementById('sec-step2').classList.toggle('locked',step<2||step>2);
  document.getElementById('sec-step3').classList.toggle('locked',step<3);
  if(step>=2) initChem();
  // Scroll to the step
  var el=document.getElementById('sec-step'+step);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

// === APPROVAL ===
function submitApproval(status){
  var reviewer=document.getElementById('reviewer-name').value.trim();
  if(!reviewer){alert('Enter reviewer name before submitting approval.');return;}
  approvalState=status;
  var banner=document.getElementById('approval-status-area');
  var cls=status==='Approved'?'approved':status==='Rejected'?'rejected':'revise';
  banner.innerHTML='<div class="approval-banner '+cls+'">STATUS: '+status.toUpperCase()+' — '+reviewer+' — '+document.getElementById('review-date').value+'</div>';
  drawStamp();
  document.getElementById('btn-download').disabled=false;
  document.getElementById('btn-cert').disabled=false;

  // Save to localStorage
  var records=JSON.parse(localStorage.getItem('qc_records')||'[]');
  var specVal=document.getElementById('spec-select').value;
  records.push({
    po:document.getElementById('po-number').value,
    heat:document.getElementById('heat1').value,
    spec:specVal?SPECS[specVal].name:'',
    type:document.getElementById('mat-type').selectedOptions[0]?document.getElementById('mat-type').selectedOptions[0].text:'',
    status:status,
    reviewer:reviewer,
    date:document.getElementById('review-date').value,
    file:MTR_DATA.fileName||'',
    comments:document.getElementById('review-comments').value,
    timestamp:new Date().toISOString()
  });
  localStorage.setItem('qc_records',JSON.stringify(records));
  renderRecords();
}

function drawStamp(){
  var canvas=document.getElementById('stamp-canvas');
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!approvalState)return;
  var x=canvas.width*0.65,y=canvas.height*0.15;
  var color=approvalState==='Approved'?'#1a7a30':approvalState==='Rejected'?'#c00':'#c5a05e';
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(-0.15);
  ctx.strokeStyle=color;
  ctx.lineWidth=4;
  ctx.strokeRect(-120,-40,240,80);
  ctx.font='bold 28px Georgia, serif';
  ctx.fillStyle=color;
  ctx.textAlign='center';
  ctx.fillText(approvalState.toUpperCase(),0,-5);
  var reviewer=document.getElementById('reviewer-name').value.trim();
  var date=document.getElementById('review-date').value;
  ctx.font='12px Georgia, serif';
  ctx.fillText(reviewer+' — '+date,0,20);
  ctx.restore();
}

function downloadStamped(){
  var pdfCanvas=document.getElementById('pdf-canvas');
  var stampCanvas=document.getElementById('stamp-canvas');
  var combined=document.createElement('canvas');
  combined.width=pdfCanvas.width;
  combined.height=pdfCanvas.height;
  var ctx=combined.getContext('2d');
  ctx.drawImage(pdfCanvas,0,0);
  ctx.drawImage(stampCanvas,0,0);
  var link=document.createElement('a');
  link.download=(MTR_DATA.fileName||'mtr').replace(/\.pdf$/i,'')+'_stamped.png';
  link.href=combined.toDataURL('image/png');
  link.click();
}

// === RECORDS ===
function renderRecords(){
  var records=JSON.parse(localStorage.getItem('qc_records')||'[]');
  var el=document.getElementById('records-list');
  if(records.length===0){el.innerHTML='<div style="color:#999">No records yet.</div>';return;}
  el.innerHTML='';
  for(var i=records.length-1;i>=0&&i>=records.length-20;i--){
    var r=records[i];
    var cls=r.status==='Approved'?'chem-pass':r.status==='Rejected'?'chem-fail':'chem-info';
    var div=document.createElement('div');
    div.style.cssText='padding:4px 0;border-bottom:1px solid #eee';
    div.innerHTML='<span class="'+cls+'">['+r.status+']</span> '+r.heat+' — '+(r.spec||'')+' — '+(r.reviewer||'')+' — '+(r.date||'');
    el.appendChild(div);
  }
}

function clearRecords(){
  if(confirm('Clear all local session records?')){
    localStorage.removeItem('qc_records');
    renderRecords();
  }
}

// === DOCUMENT SWITCHING (multi-doc MTRs) ===
function switchDocument(){
  var sel=document.getElementById('doc-select');
  currentDocIdx=parseInt(sel.value)||0;
  var docs=MTR_DATA.documents||[];
  if(docs[currentDocIdx]){
    fillFields(docs[currentDocIdx]);
    // Navigate PDF to this doc's page
    if(pdfDoc&&docs[currentDocIdx].pageIndex!==undefined){
      renderPage(docs[currentDocIdx].pageIndex+1);
    }
    // Reset steps
    currentStep=1;
    document.getElementById('sec-step2').classList.add('locked');
    document.getElementById('sec-step3').classList.add('locked');
    document.getElementById('sec-step1').classList.remove('locked');
    approvalState=null;
    document.getElementById('approval-status-area').innerHTML='';
    document.getElementById('btn-download').disabled=true;
    document.getElementById('btn-cert').disabled=true;
  }
}

// === INIT ===
function init(){
  // Set today's date
  document.getElementById('review-date').value=new Date().toISOString().split('T')[0];

  // Setup document selector if multiple documents
  var docs=MTR_DATA.documents||[];
  if(docs.length>1){
    var sel=document.getElementById('doc-select');
    document.getElementById('doc-selector').style.display='flex';
    for(var i=0;i<docs.length;i++){
      var opt=document.createElement('option');
      opt.value=i;
      var label=docs[i].mill||('Page '+(docs[i].pageIndex+1));
      if(docs[i].heatNumbers&&docs[i].heatNumbers[0]) label+=' — Heat '+docs[i].heatNumbers[0];
      opt.textContent=label;
      sel.appendChild(opt);
    }
  }

  // Fill first document
  if(docs.length>0){
    fillFields(docs[0]);
  }else{
    onMaterialChange();
  }

  // Load PDF
  if(MTR_DATA.fileUrl){
    loadPDF(MTR_DATA.fileUrl);
  }else{
    document.getElementById('loading').textContent='No document loaded. Upload a PDF to begin.';
  }

  renderRecords();
}

// Start
window.addEventListener('load',init);
